<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CleanCaption - Social Media Line Break Fixer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
        <h1 class="text-2xl font-bold mb-2 text-cyan-400">CleanCaption </h1>
        <p class="text-slate-400 text-sm mb-6">Fix line breaks and format captions instantly for Instagram, LinkedIn, and X.</p>
        
        <div class="mb-4">
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Your Raw Text</label>
            <textarea id="inputText" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm focus:outline-none focus:border-cyan-500 transition-colors" placeholder="Type or paste your caption here..."></textarea>
        </div>

        <div class="flex gap-3 mb-6">
            <button onclick="formatText()" class="flex-1 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 px-4 rounded-xl transition-all shadow-lg shadow-cyan-500/20 cursor-pointer">
                Format Caption
            </button>
            <button onclick="copyText()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2.5 px-4 rounded-xl transition-all cursor-pointer">
                Copy Result
            </button>
        </div>

        <div>
            <label class="block text-xs uppercase tracking-wider text-slate-400 mb-1 font-semibold">Formatted Output</label>
            <textarea id="outputText" rows="6" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-cyan-200 focus:outline-none" placeholder="Formatted text will appear here..."></textarea>
        </div>
    </div>

    <script>
        function formatText() {
            let input = document.getElementById('inputText').value;
            // Replaces normal newlines with invisible space + newline to preserve breaks on mobile platforms
            let formatted = input.replace(/\r\n/g, '\n').replace(/\n/g, ' \n');
            document.getElementById('outputText').value = formatted;
        }

        function copyText() {
            let output = document.getElementById('outputText');
            output.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }
    </script>
</body>
</html>
